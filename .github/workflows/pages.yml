name: Project website

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - assets/**
      - scripts/real_dataset_metadata.yaml
      - scripts/build_collection_catalog.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build collection catalog
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/build_collection_catalog.py
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp -R assets _site/assets
          cp scripts/real_dataset_metadata.yaml _site/real_dataset_metadata.yaml
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
